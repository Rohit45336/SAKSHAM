<!DOCTYPE html>
<html>
<head>
    <title>Create Admin | SAKSHAM</title>
</head>

<body>

    <h2>Create SAKSHAM Admin</h2>

    <button onclick="createAdmin()">
        Create Admin Account
    </button>

    <p id="message"></p>


    <script>

        async function createAdmin() {

            try {

                const response = await fetch(
                    "https://saksham-backend-d0h9.onrender.com/api/create-admin",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name: "SAKSHAM Admin",
                            email: "admin@saksham.com",
                            password: "Admin@12345"
                        })
                    }
                );


                const data = await response.json();

                document.getElementById("message").textContent =
                    data.message;


            } catch (error) {

                document.getElementById("message").textContent =
                    "Unable to connect to backend.";

                console.error(error);

            }

        }

    </script>

</body>
</html>
